version = 1
default_agent = "nyako"
agents_dir = "agents"
tools_dir = "tools"
hooks_dir = "hooks"
skills_dir = "skills"
memory_dir = "memory"
schedules_dir = "schedules"

[[startup_sessions]]
id = "hub_neko"
owner = "hub-neko"
title = "中枢喵"
topic = "Nyako runtime hub"
goal = "作为 Nyako 团队唯一中枢，接收 monitor-neko 和 schedules 的路由建议，并决定是否派发到业务 Session。"
state = "ready"

[[startup_sessions]]
id = "sess_monitor_neko_github_watch"
owner = "monitor-neko"
title = "GitHub 通知监控"
topic = "GitHub notification monitoring"
goal = "执行 GitHub 通知扫描，将可信且需要行动的事件作为路由建议发送给 hub_neko。"
state = "ready"

[runtime_loop]
schedules_enabled = true

[[skills.external]]
provider = "github"
repo = "ShigureLab/gh-llm"
skill = "github-conversation"
ref = "main"

[acp]
enabled = true

[acp.agents.codex]
enabled = true
permissions = "approve-all"
timeout = 900
