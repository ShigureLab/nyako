id = "hub-neko"
name = "hub-neko"
role = "hub"
tools = ["runtime-session", "runtime-workspace", "runtime-memory"]

[skills]
enable = []

[compaction]
enabled = true
# Trigger at 150k tokens for the current 272k model window, above retained history.
reserveTokens = 122000
keepRecentTokens = 20000

[model]
model = "openai-codex/gpt-6-sol"
credential = "openai-codex-default"
thinking = "medium"
