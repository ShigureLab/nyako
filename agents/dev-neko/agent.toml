id = "dev-neko"
name = "dev-neko"
role = "software-engineer"
tools = [
  "read",
  "bash",
  "edit",
  "write",
  "grep",
  "find",
  "ls",
  "runtime-session",
  "runtime-workspace",
  "runtime-memory",
]

[skills]
enable = ["github-conversation", "github-contribution-guidelines"]

[compaction]
enabled = true
# Match Codex's default auto-compaction at 90% of the current 500k model window.
reserveTokens = 50000
keepRecentTokens = 20000

[model]
model = "openai-codex/gpt-6.1-sol"
credential = "openai-codex-default"
thinking = "xhigh"
